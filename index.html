<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swayam Learning Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff;--fg:#1f2430;--mut:#5f6368;--card:#fff;--bd:#e1e4ea;--blue:#1a73e8;--navy:#003a8c;--lav:#e9ebfd;--mint:#f4fbee;--soft:#f3f5fa;--ora:#f5ae4c;--ok:#22a847;--acct:#0b57a4;--ttl:#1565c0;--sel:#eaf1fd;--sel2:#2563eb;--page:#f2f3fb;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;cursor:pointer;color:inherit}a{color:var(--blue);cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ban{background:var(--navy);color:#fff;text-align:center;font-size:12px;padding:5px}
header.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap}
.logo{font-weight:800;font-size:22px;color:var(--blue);letter-spacing:-.5px;background:none;border:0;padding:0}.logo small{display:block;font-size:9px;color:#e8590c;font-weight:600;letter-spacing:0}
nav.m{display:flex;gap:6px;flex-wrap:wrap;flex:1}nav.m button{background:none;border:0;padding:6px 8px;border-radius:6px}nav.m button:hover{background:var(--soft)}
.ic{width:36px;height:36px;border-radius:50%;border:0;background:var(--acct);color:#fff;font-weight:700}.lw .ic{background:#1a5ff0}
.dd{position:relative}.menu{position:absolute;right:0;top:44px;min-width:230px;background:var(--card);border:1px solid var(--bd);border-radius:10px;box-shadow:0 8px 24px #0003;z-index:30;overflow:hidden}
.menu div,.menu button{display:block;width:100%;text-align:left;padding:11px 16px;border:0;background:none}.menu button:hover{background:var(--soft)}.menu .em{color:var(--blue);font-size:13px;border-bottom:1px solid var(--bd)}
main{max-width:1100px;margin:0 auto;padding:20px}
.hero{text-align:center;padding:30px 0}.hero .logo{font-size:56px}
.sb{display:flex;max-width:640px;margin:20px auto;border:1px solid var(--bd);border-radius:8px;overflow:hidden;background:var(--card)}.sb input{flex:1;border:0;padding:13px;font:inherit;background:transparent;color:inherit;min-width:0}.sb button{border:0;border-left:1px solid var(--bd);background:var(--soft);padding:0 16px}
.cats{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;margin-top:24px}.cat{width:110px;background:none;border:0;text-align:center;font-size:14.5px;line-height:1.45;font-family:inherit}.cat i{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 6px;border-radius:50%;background:#eaf3fb;color:#4a78b5;border:1px solid #d6e4f2;font-style:normal;font-size:22px}
.stats{display:flex;justify-content:space-around;background:var(--soft);padding:22px;flex-wrap:wrap;gap:10px;text-align:center;margin-top:30px}.stats b{display:block;font-size:28px;font-weight:700;color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:0 1px 4px #0002;overflow:hidden}.card .th{height:110px;background:linear-gradient(135deg,#7bb7ff,#f48fb1);display:grid;place-items:center;font-size:40px}.card .bd{padding:14px}
.btn{border:1px solid var(--blue);color:var(--blue);background:none;border-radius:5px;padding:8px 12px;font-size:12.5px;font-weight:500}.btn.p{background:var(--blue);color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}.btn:hover:not(:disabled){filter:brightness(1.1)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--bd);margin:12px 0}.tabs button{background:none;border:0;padding:10px 4px;border-bottom:3px solid transparent;font-size:15px}.tabs .on{color:var(--blue);border-color:var(--blue)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.crumb{color:var(--mut)}.crumb b{color:var(--fg)}
.empty{text-align:center;color:var(--mut);padding:40px}
.lw nav.m button{font-size:14px;font-weight:500}.card .bd>b{font-size:16px;font-weight:500}.card .bd .crumb{font-size:14px}.crumb{font-size:16px}.sb input{font-size:16px}.ls{font-size:14px;font-family:inherit}.hero .logo{font-size:56px}
.qh{background:var(--mint);padding:18px 24px;border-bottom:1px solid var(--bd)}.qhr{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.qtt{font-size:18px;font-weight:700}.due{color:#e00000;font-weight:700;font-size:14px}.qsub{color:#5f6368;font-weight:500}.qsub small{font-size:13px;font-weight:500}
.qc{border:1px solid var(--bd);border-radius:10px;padding:20px 20px 16px;margin:0 0 20px;min-width:0}.qt{display:flex;justify-content:space-between;gap:16px;font-weight:600;font-size:16px;margin-bottom:8px}.pt{white-space:nowrap;font-weight:500}
.opt{display:flex;align-items:center;gap:22px;padding:14px 12px;font-size:16px;cursor:pointer}.opt input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border:2px solid #cfd3da;border-radius:50%;background:#f3f4f6;margin:0;flex:none}.opt input:checked{border-color:var(--blue);background:var(--blue);box-shadow:inset 0 0 0 4px #fff}.opt input:disabled:checked{border-color:#b5b8be;background:#b5b8be}
.fp{border:1px solid var(--ok);color:var(--ok);border-radius:20px;padding:8px 16px;font-size:14px;font-weight:700}.fp.bad{border-color:#d93025;color:#d93025}.sr{position:absolute;left:-9999px}
/* learning */
.lw{background:var(--lav);min-height:100vh}.lw header.top{background:var(--lav);border:0}
.lay{display:grid;grid-template-columns:340px 1fr;gap:16px;padding:0 16px 16px;height:calc(100vh - 70px)}
.side,.pane{background:var(--card);border-radius:18px;border:1px solid var(--bd);overflow:hidden;display:flex;flex-direction:column;min-height:0}
.side h2{margin:0;color:var(--ttl);font-size:20px;font-weight:500}.sh{background:var(--mint);padding:18px 22px;border-bottom:1px solid var(--bd)}
.pg{display:flex;justify-content:space-between;margin-top:14px;font-size:14px}.pgb{height:5px;background:var(--bd);border-radius:3px;margin-top:6px}.pgb i{display:block;height:100%;background:var(--ok);border-radius:3px}
.cur{overflow:auto;flex:1;overscroll-behavior:contain}
.wk{display:flex;width:100%;gap:10px;text-align:left;background:none;border:0;padding:12px 18px;font-weight:500;font-size:16px;font-family:inherit}
.ls{display:flex;gap:10px;align-items:flex-start;padding:9px 12px 9px 22px;border-left:4px solid transparent;width:100%;background:none;border-top:0;border-right:0;border-bottom:0;text-align:left;font-size:14px}.ls:hover{background:var(--soft)}.ls.sel{background:var(--sel);border-left-color:var(--sel2)}
.ck{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--mut);margin-top:2px;display:grid;place-items:center;font-size:11px;color:#fff;background:none;padding:0}.ck.d{background:var(--ok);border-color:var(--ok)}
.ph{background:var(--mint);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--bd)}
.pill{background:linear-gradient(90deg,#0a4ff0,#12c69a);color:#fff;padding:7px 14px;border-radius:20px;font-weight:600;font-size:14px;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.body{padding:22px;overflow:auto;flex:1}
.ph2{background:var(--soft);border:2px dashed var(--bd);border-radius:10px;padding:50px 20px;text-align:center;color:var(--mut)}
textarea,input.t,select{width:100%;font:inherit;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:inherit}
.err{color:#d93025;font-size:13px;margin:4px 0}.tag{background:#fff3cd;color:#664d03;border-radius:4px;padding:1px 6px;font-size:11px}
.q{border:1px solid var(--bd);border-radius:8px;padding:12px;margin:10px 0}.q label{display:block;padding:3px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#202637;color:#fff;padding:11px 18px;border-radius:8px;z-index:50;max-width:90vw}
@media(max-width:820px){.lay{grid-template-columns:1fr;height:auto}.side{max-height:50vh}.pane{min-height:60vh}}
</style></head><body><div id="app"></div><div id="toast" class="toast" role="status" hidden></div>

const qs=B.map((q,i)=>{const ok=r&&r.a[i]===q[2];return `<fieldset class="qc" ${r?'disabled':''}><legend class="sr">Question ${i+1}</legend><div class="qt"><span><b>${i+1}.</b> ${esc(q[0])}${n===1&&i===0?'':''}</span><span class="pt">1 Point</span></div>${q[1].map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}" ${r&&r.a[i]===j?'checked':''}>${esc(o)}</label>`).join('')}${r?`<div class="row" style="margin-top:14px"><span class="fp ${ok?'':'bad'}">${ok?'Yes, the answer is correct. Score: 1':'No, the answer is incorrect. Score: 0'}</span><span class="fp">Accepted answer is ${esc(q[1][q[2]])}</span></div>`:''}</fieldset>`}).join('');
return learn(phd('Assessment',id)+`<div class="qh"><div class="qhr"><b class="qtt">Week ${n} : Assignment ${n}</b><span class="due">Due date on ${ist(due)}</span></div><div class="qsub">${past?'The due date for submitting this assignment has passed.':'Submit before the due date.'}${r?`<small>Your last recorded submission was on ${r.at}.</small>`:(past?'':'')}</div></div><div class="body">${qs}${r?`<p><b>Score: ${sc} / ${B.length}</b>${r.dflt?' <span class="tag">Sample graded view</span> <button class="btn" data-a="retake" data-l="${id}">Retake</button>':''}</p>`:`<div id="ae" class="err"></div><button class="btn p" data-a="quiz" data-l="${id}">Submit Quiz</button>`}<div style="margin-top:18px"><button class="btn ${done?'':'p'}" data-a="tog" data-l="${id}">${done?'\u2713 Completed \u2014 mark incomplete':'Mark as complete'}</button></div></div>`)}
function qaBlock(){const q=S.qaq.toLowerCase();const L=S.qa.filter(x=>x.q.toLowerCase().includes(q));return `<input class="t" id="qs" placeholder="Search questions" aria-label="Search questions" value="${esc(S.qaq)}"><div class="row"><input class="t" id="nq" placeholder="Ask a question" aria-label="New question" style="flex:1"><button class="btn p" data-a="ask">Post</button></div><div id="ae" class="err"></div>${L.length?L.map(x=>`<div class="q"><b>${esc(x.q)}</b>${x.a.map(a=>`<p style="margin:6px 0 0 14px">↳ ${esc(a)}</p>`).join('')||'<p class="crumb">No answers yet.</p>'}<div class="row"><input class="t" style="flex:1" id="r${x.id}" placeholder="Reply" aria-label="Reply"><button class="btn" data-a="reply" data-i="${x.id}">Reply</button></div></div>`).join(''):'<div class="empty">No matching questions.</div>'}`}
function sub(){const r=S.route;let t,b;
if(r==='about'){t='About the course';b=`<h3>Organizational Behaviour</h3><p>Placeholder description of a 12-week course on individuals, groups and organizations.</p><p><b>Instructor:</b> Instructor</p><p><b>Duration:</b> 12 weeks</p><h4>Learning objectives</h4><ul><li>Explain core OB concepts</li><li>Compare motivation theories</li><li>Analyse group dynamics</li></ul><h4>Syllabus</h4><ol>${topics.map(x=>`<li>${x}</li>`).join('')}</ol>`}
else if(r==='ann'){t='Announcements';const a=S.ann;b=a!==null?`<button class="btn" data-a="annb">← All</button><h3>${esc(ANN[a][0])}</h3><p class="crumb">${ANN[a][1]}</p><p>${esc(ANN[a][2])}</p>`:ANN.map((x,i)=>`<button class="q" style="display:block;width:100%;text-align:left;background:none" data-a="annv" data-i="${i}"><b>${esc(x[0])}</b><div class="crumb">${x[1]}</div></button>`).join('')}
else if(r==='bm'){t='My Bookmarks';const k=LS.filter(l=>S.bm[l.id]);b=k.length?k.map(l=>`<div class="q row" style="justify-content:space-between"><a data-a="les" data-l="${l.id}">${esc(l.t)}</a><span class="crumb">${l.w.t}</span><button class="btn" data-a="bmk" data-l="${l.id}">Remove</button></div>`).join(''):'<div class="empty">No bookmarks yet. Use the bookmark button in a lesson.</div>'}
else{t='Q&A';b=qaBlock()}
return learn(phd(t)+`<div class="body">${b}</div>`)}
function render(){const r=S.route;if(!S.signed&&r!=='home'){S.route='home'}
const f=document.activeElement&&document.activeElement.id;let h;
if(S.route==='home')h=home();else if(S.route==='mycourses')h=mycourses();else if(S.route==='certs')h=certs();else if(S.route==='lesson')h=lesson();else if(['about','ann','bm','qa'].includes(S.route))h=sub();else{S.route='home';h=`<main class="empty">Page not found.</main>`}
const cs=document.getElementById('cur'),sc=cs?cs.scrollTop:0;document.body.style.background=S.route==='mycourses'||S.route==='certs'?'var(--page)':'';
document.getElementById('app').innerHTML=(S.route==='home'||S.route==='mycourses'||S.route==='certs'?'<div class="ban">An initiative by Ministry of Education (Govt. of India)</div>':'')+h;
const c2=document.getElementById('cur');if(c2)c2.scrollTop=sc;
if(f){const e=document.getElementById(f);if(e&&e.focus){e.focus();try{e.setSelectionRange(1e4,1e4)}catch(x){}}}}
// ---- events ----
const A={go:d=>go(d.r),info:d=>toast(d.m),menu:d=>{menu=menu===d.m?null:d.m;render()},out:()=>{S.signed=false;S.route='home';menu=null;save();render();toast('Signed out')},in:()=>{S.signed=true;save();render()},
search:()=>{S.q=document.getElementById('hq').value.trim();S.cat='';save();render()},cat:d=>{S.cat=S.cat===d.c?'':d.c;S.q='';save();render()},clear:()=>{S.q='';S.cat='';save();render()},
tab:d=>{S.tab=d.v;save();render()},sync:()=>{toast('Synced: courses up to date');},course:()=>go('lesson',{lesson:S.lesson}),
exam:d=>{if(d.v==='reg'){S.exam='pay';toast('Registration started; payment pending')}else{toast(S.exam==='none'?'Not registered yet':S.exam==='pay'?'Payment pending (simulated)':'Registered')}if(d.v==='chk'&&S.exam==='pay'){S.exam='reg';toast('Payment marked as received')}menu=null;save();render()},
wk:d=>{S.open[d.w]=!S.open[d.w];save();render()},les:d=>go('lesson',{lesson:d.l,open:Object.assign(S.open,{[byId(d.l).w.id]:1})}),
tog:d=>{S.done[d.l]=!S.done[d.l];save();render()},bmk:d=>{S.bm[d.l]=!S.bm[d.l];if(!S.bm[d.l])delete S.bm[d.l];save();render();toast(S.bm[d.l]?'Bookmarked':'Bookmark removed')},
fs:()=>{const p=document.getElementById('pane');try{document.fullscreenElement?document.exitFullscreen():p.requestFullscreen()}catch(e){toast('Fullscreen unavailable')}},
dl:d=>{try{const u=URL.createObjectURL(new Blob(['Sample notes.'],{type:'text/plain'}));const a=document.createElement('a');a.href=u;a.download='notes.txt';a.click()}catch(e){toast('Download unavailable here')}},
draft:d=>{S.drafts[d.l]=document.getElementById('as').value;save();toast('Draft saved')},
subm:d=>{const v=document.getElementById('as').value.trim();if(v.length<20){document.getElementById('ae').textContent='Please write at least 20 characters.';return}S.subs[d.l]={v,at:new Date().toLocaleString()};S.done[d.l]=true;delete S.drafts[d.l];save();render();toast('Assignment submitted')},
retake:d=>{S.retake=S.retake||{};S.retake[d.l]=1;delete S.quiz[d.l];save();render()},
quiz:d=>{const n=+byId(d.l).w.id.slice(1),B=QS(n);const a=B.map((q,i)=>{const e=document.querySelector(`input[name=q${i}]:checked`);return e?+e.value:null});if(a.includes(null)){document.getElementById('ae').textContent='Answer all questions first.';return}S.quiz[d.l]={a,s:a.filter((x,i)=>x===B[i][2]).length,at:ist(Date.now())};S.retake=S.retake||{};delete S.retake[d.l];S.done[d.l]=true;save();render();toast('Quiz submitted')},
fb:d=>{const r=document.getElementById('fr').value,c=document.getElementById('fc').value.trim();if(!r||!c){document.getElementById('ae').textContent='Choose a rating and add a comment.';return}S.fb[d.l]={r,c};S.done[d.l]=true;save();render();toast('Feedback saved')},
annv:d=>{S.ann=+d.i;save();render()},annb:()=>{S.ann=null;save();render()},
ask:()=>{const v=document.getElementById('nq').value.trim();if(!v){document.getElementById('ae').textContent='Enter a question.';return}S.qa.unshift({id:Date.now(),q:v,a:[]});save();render();toast('Question posted')},
reply:d=>{const e=document.getElementById('r'+d.i),v=e.value.trim();if(!v){toast('Write a reply first');return}S.qa.find(x=>x.id==d.i).a.push(v);save();render()}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&t.tagName!=='FORM'){e.preventDefault();A[t.dataset.a]&&A[t.dataset.a](t.dataset);return}if(menu&&!e.target.closest('.dd')){menu=null;render()}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target.closest('[data-a]');if(f)A[f.dataset.a]()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&menu){menu=null;render()}});
document.addEventListener('input',e=>{if(e.target.id==='cq'){S.q=e.target.value;render()}if(e.target.id==='qs'){S.qaq=e.target.value;render()}});
render();
</script></body></html>
